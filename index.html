<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferrymark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="content">
    <div class="brand">
      <div class="wordmark">Ferrymark</div>
      <div>Hi, Priya</div>
    </div>

    <div>
      <h1>Victor Raman's Estate</h1>
      <small class="subtitle">Estate Overview · November 20, 2026</small>
    </div>

    <div class="card">
      <div class="title">
        <div class="icon">
          <i class="fa-solid fa-list"></i>
        </div>
        <div>
          <h2>1. Estate Summary</h2>
        </div>
      </div>

      <div>
        <p><strong>Victor Raman</strong> · Passed Aug 14, 2026</p>
        <p><strong>Executors:</strong> Priya and Daniel</p>
        <p><strong>Ontario probate pending</strong> · Florida probate blocked</p>
      </div>
    </div>

    <div class="card col">
      <div class="title">
        <div class="icon">
          <i class="fa-solid fa-list"></i>
        </div>
        <div>
          <h2>2. Estate Progress</h2>
        </div>
      </div>

      <div>
          <div>Ontario probate application submitted</div>
          <div class="badge">Pending</div>
    </div>

  </main>
  <script src="script.js"></script>
</body>
